<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Общий доступ — CloudBox</title>
<link rel="stylesheet" href="/app.css">
<style>
  .pub { max-width: 920px; margin: 0 auto; padding: 24px 16px 60px; }
  .pub-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 18px; flex-wrap: wrap; }
  .pub-file { text-align: center; padding: 40px 20px; }
  .pub-file .big { font-size: 56px; }
  .pub-file h1 { font-size: 20px; margin: 12px 0 4px; word-break: break-word; }
  .pub-file .media { margin: 20px auto 0; max-width: 100%; }
  .pub-file .media img, .pub-file .media video { max-width: 100%; max-height: 70vh; border-radius: 8px; }
</style>
</head>
<body>
<div class="pub" id="root"></div>
<div class="toasts" id="toasts"></div>
<script src="/share.js"></script>
</body>
</html>
