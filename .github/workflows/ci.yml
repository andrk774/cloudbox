name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cloudbox
          POSTGRES_PASSWORD: cloudbox
          POSTGRES_DB: cloudbox
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cloudbox" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Системные утилиты (миниатюры, PDF)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg poppler-utils
      - name: go vet
        run: go vet ./...
      - name: Unit-тесты
        run: go test -race ./...
      - name: Сборка
        run: |
          go build -o cloudbox ./cmd/cloudbox
          go build -o cloudbox-sync ./cmd/cloudbox-sync
          go build -o mailtest ./internal/mail/mailtest/cmd/mailtest
          go build -o cloudbox-desktop ./cmd/cloudbox-desktop
      - name: Тестовые файлы и фейковый WOPI discovery
        run: |
          mkdir -p fx/hosting
          ffmpeg -v error -f lavfi -i testsrc=size=1600x1200:rate=1 -frames:v 1 -q:v 3 fx/photo.jpg
          ffmpeg -v error -f lavfi -i testsrc=size=640x360:rate=25 -t 2 -pix_fmt yuv420p fx/clip.mp4
          cat > fx/hosting/discovery <<'EOF'
          <wopi-discovery><net-zone name="external-http"><app name="writer">
          <action name="edit" ext="docx" urlsrc="http://127.0.0.1:9980/browser/x/cool.html?"/></app></net-zone></wopi-discovery>
          EOF
          (cd fx && python3 -m http.server 9980 --bind 127.0.0.1 >/dev/null 2>&1 &)
      - name: Сквозные тесты
        env:
          CB_DATABASE_URL: postgres://cloudbox:cloudbox@127.0.0.1:5432/cloudbox?sslmode=disable
          CB_LISTEN: 127.0.0.1:8080
          CB_PUBLIC_URL: http://127.0.0.1:8080
          CB_SECRET: ci
          CB_DATA_DIR: ${{ runner.temp }}/data
          CB_TMP_DIR: ${{ runner.temp }}/tmp
          CB_MAX_VERSIONS: 2
          CB_DEFAULT_QUOTA_MB: 50
          CB_MAX_UPLOAD_MB: 20
          CB_WOPI_URL: http://127.0.0.1:9980
          # e2e2.py сверяет дату EXIF без смещения в UTC; без этого сервер взял бы пояс по умолчанию (Asia/Yekaterinburg)
          CB_TZ: UTC
          # почта: тестовый IMAP/SMTP-сервер на 127.0.0.1:1143 и :1025
          CB_MAIL_ALLOW_PRIVATE: "true"
          CB_MAIL_EXTRA_PORTS: "1143,1025"
        run: |
          mkdir -p "$CB_TMP_DIR"
          ./mailtest -imap 127.0.0.1:1143 -smtp 127.0.0.1:1025 > mailtest.log 2>&1 &
          ./cloudbox > server.log 2>&1 &
          for i in $(seq 30); do curl -sf http://127.0.0.1:8080/healthz && break; sleep 1; done
          CB_URL=http://127.0.0.1:8080 python3 scripts/e2e.py
          CB_URL=http://127.0.0.1:8080 FIXTURES=fx python3 scripts/e2e2.py
          CB_URL=http://127.0.0.1:8080 python3 scripts/e2e_talk.py
          CB_URL=http://127.0.0.1:8080 SHOT=call.png MAILTEST_SMTP=1025 MAILTEST_IMAP=1143 node scripts/e2e_browser.mjs
          CB_URL=http://127.0.0.1:8080 python3 scripts/e2e_mail.py
          CB_URL=http://127.0.0.1:8080 python3 scripts/e2e_crypto.py
          PASS=$(python3 scripts/app_password.py http://127.0.0.1:8080 andrey secret123)
          CB_URL=http://127.0.0.1:8080 CB_USER=andrey CB_PASS=$PASS SYNC=./cloudbox-sync sh scripts/sync-test.sh
          CB_URL=http://127.0.0.1:8080 CB_USER=andrey CB_PASS=$PASS DESKTOP=./cloudbox-desktop sh scripts/desktop-test.sh
      - name: Лог сервера
        if: failure()
        run: cat server.log
      - name: Снимок экрана видеозвонка
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: call-screenshot
          path: call.png
          if-no-files-found: ignore
