# Базовый запуск:                 docker compose up -d
# С HTTPS через Caddy:            docker compose --profile https up -d      (DOMAIN в .env)
# С хранилищем Garage (S3):       docker compose --profile s3 up -d         (см. README, «S3 / Garage»)
# С онлайн-офисом Collabora:      docker compose --profile https --profile office up -d   (OFFICE_DOMAIN в .env)
# С TURN для видеозвонков:        docker compose --profile https --profile talk up -d     (CB_TURN_SECRET в .env)
# Профили можно сочетать.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: cloudbox
      POSTGRES_PASSWORD: ${DB_PASSWORD:-cloudbox}
      POSTGRES_DB: cloudbox
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloudbox"]
      interval: 5s
      retries: 10

  app:
    build: .
    image: cloudbox:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      CB_DATABASE_URL: postgres://cloudbox:${DB_PASSWORD:-cloudbox}@db:5432/cloudbox?sslmode=disable
    volumes:
      - appdata:/data
      - ./backups:/backups
    ports:
      - "${APP_PORT:-8080}:8080"

  caddy:
    profiles: ["https"]
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [app]
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
      OFFICE_DOMAIN: ${OFFICE_DOMAIN:-office.localhost}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data

  garage:
    profiles: ["s3"]
    image: dxflrs/garage:v2.1.0
    restart: unless-stopped
    volumes:
      - ./deploy/garage.toml:/etc/garage.toml:ro
      - garagemeta:/var/lib/garage/meta
      - garagedata:/var/lib/garage/data

  # Collabora Online (CODE) — редактирование DOCX/XLSX/PPTX/ODT прямо в браузере.
  collabora:
    profiles: ["office"]
    image: collabora/code:latest
    restart: unless-stopped
    cap_add: [MKNOD]
    environment:
      aliasgroup1: https://${DOMAIN:-localhost}:443
      extra_params: --o:ssl.enable=false --o:ssl.termination=true --o:net.frame_ancestors=${DOMAIN:-localhost}
      dictionaries: ru_RU en_US
      username: admin
      password: ${COLLABORA_ADMIN_PASSWORD:-change-me}

  # coturn — ретрансляция медиапотока видеозвонков, когда участники за NAT.
  # host-сеть: TURN нужен широкий диапазон UDP-портов, проброс через docker-proxy слишком медленный.
  coturn:
    profiles: ["talk"]
    image: coturn/coturn:4.6
    restart: unless-stopped
    network_mode: host
    command:
      - -n
      - --log-file=stdout
      - --no-cli
      - --fingerprint
      - --use-auth-secret
      - --static-auth-secret=${CB_TURN_SECRET:?задайте CB_TURN_SECRET в .env}
      - --realm=${DOMAIN:-localhost}
      - --listening-port=3478
      - --min-port=49160
      - --max-port=49200
      # сервер за NAT (дома за роутером): раскомментируйте и укажите внешний IP
      # - --external-ip=203.0.113.10
      # не ретранслировать во внутренние сети: иначе TURN становится входом в локальную сеть сервера
      - --no-multicast-peers
      - --denied-peer-ip=0.0.0.0-0.255.255.255
      - --denied-peer-ip=10.0.0.0-10.255.255.255
      - --denied-peer-ip=100.64.0.0-100.127.255.255
      - --denied-peer-ip=127.0.0.0-127.255.255.255
      - --denied-peer-ip=169.254.0.0-169.254.255.255
      - --denied-peer-ip=172.16.0.0-172.31.255.255
      - --denied-peer-ip=192.168.0.0-192.168.255.255
      - --denied-peer-ip=::1
      - --denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
      - --denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff

volumes:
  pgdata:
  appdata:
  caddydata:
  garagemeta:
  garagedata:
